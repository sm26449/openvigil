# OpenVigil — stack-ul complet. Toate serviciile folosesc reteaua gazdei: go2rtc asculta
# doar pe 127.0.0.1, WebRTC pe :8555, iar scanarea de retea/ONVIF si WS-Discovery merg
# fara NAT. Porturile se schimba din .env (WEB_PORT, STREAM_PORT, AI_PORT).
#
#   ./install.sh                      # prima instalare (Docker, GPU, .env, imaginea din GHCR, pornire)
#   docker compose up -d              # fara GPU, cu imaginea publicata (ghcr.io/sm26449/openvigil)
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d   # cu NVIDIA
#   docker compose up -d --build      # construita local (OPENVIGIL_IMAGE=openvigil OPENVIGIL_VERSION=local in .env)
#   docker compose logs -f web        # jurnal
#   docker compose run --rm --no-deps web test  # pytest

name: ${COMPOSE_PROJECT_NAME:-openvigil}

x-openvigil: &openvigil
  image: ${OPENVIGIL_IMAGE:-ghcr.io/sm26449/openvigil}:${OPENVIGIL_VERSION:-latest}
  network_mode: host
  env_file: ${ENV_FILE:-.env}
  environment:
    TZ: ${TZ:-UTC}
  volumes:
    - ${DATA_DIR:-./data}:/opt/openvigil/data
  restart: unless-stopped
  stop_grace_period: 25s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  go2rtc:
    <<: *openvigil
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
        OPENVIGIL_VERSION: ${OPENVIGIL_BUILD_VERSION:-dev}
    command: go2rtc
    healthcheck:
      test: ["CMD-SHELL", "curl -sf ${GO2RTC_API:-http://127.0.0.1:1984}/api"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    <<: *openvigil
    command: web
    volumes:
      - ${DATA_DIR:-./data}:/opt/openvigil/data
      - ${MODELS_DIR:-./models}:/home/openvigil/.cache
    depends_on:
      go2rtc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:${WEB_PORT:-8079}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  record:
    <<: *openvigil
    command: record
    environment:
      TZ: ${TZ:-UTC}
      OPENVIGIL_HEARTBEAT: /opt/openvigil/data/.heartbeat-record
    depends_on:
      go2rtc:
        condition: service_healthy
    healthcheck:
      # bataia de inima a buclei principale (sdnotify.watchdog): mai veche de 2 minute = blocat
      test: ["CMD-SHELL", "find /opt/openvigil/data/.heartbeat-record -mmin -2 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  ai:
    <<: *openvigil
    command: ai
    volumes:
      - ${DATA_DIR:-./data}:/opt/openvigil/data
      - ${MODELS_DIR:-./models}:/home/openvigil/.cache
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:${AI_PORT:-8077}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
