# openvigil.dev — serverul paginii (Traefik face TLS in fata)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css image/svg+xml text/plain;
    gzip_min_length 512;

    # pagina n-are niciun script; stilurile sunt in <style> din pagina
    set $csp "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $csp always;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location /img/ { expires 7d; add_header Cache-Control "public, max-age=604800"; add_header X-Content-Type-Options "nosniff" always; }
    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header X-Frame-Options "DENY" always; add_header Content-Security-Policy $csp always; }
    location / { try_files $uri $uri/ =404; }
}
