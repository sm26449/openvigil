# Publica site/ pe GitHub Pages (openvigil.dev). Cere Pages activat in Settings -> Pages
# (sursa: GitHub Actions) si DNS-ul domeniului spre GitHub; pana atunci rularea pica, de aceea
# porneste doar manual sau la schimbari in site/.
name: Site

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
