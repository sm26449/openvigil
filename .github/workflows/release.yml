# Release: la un tag `vX.Y.Z` construieste imaginea cu versiunea in ea, o testeaza, o publica
# in GitHub Container Registry (ghcr.io/sm26449/openvigil:X.Y.Z si :latest) si creeaza
# release-ul pe GitHub cu notele din CHANGELOG.md. Doar amd64 (CUDA).
#
#   git tag -a v1.0.0 -m "1.0.0" && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

env:
  IMAGINE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: imagine + release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Versiunea din tag
        id: v
        run: |
          echo "versiune=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || { echo "CHANGELOG.md nu are sectiunea [${GITHUB_REF_NAME#v}]"; exit 1; }

      - name: Loc pe disc (imaginea are ~11 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Build
        run: |
          docker build -t "$IMAGINE:${{ steps.v.outputs.versiune }}" \
            --build-arg PUID=1000 --build-arg PGID=1000 \
            --build-arg OPENVIGIL_VERSION=${{ steps.v.outputs.versiune }} .

      - name: Teste in imagine
        run: |
          docker run --rm "$IMAGINE:${{ steps.v.outputs.versiune }}" venv/bin/python -c "import config; assert config.VERSIUNE == '${{ steps.v.outputs.versiune }}', config.VERSIUNE"
          docker run --rm -e TZ=Europe/Bucharest "$IMAGINE:${{ steps.v.outputs.versiune }}" test

      - name: Publicare in GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGINE:${{ steps.v.outputs.versiune }}" "$IMAGINE:latest"
          docker push "$IMAGINE:${{ steps.v.outputs.versiune }}"
          docker push "$IMAGINE:latest"

      - name: Notele din CHANGELOG
        run: |
          awk -v v="${{ steps.v.outputs.versiune }}" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}' CHANGELOG.md > note.md
          printf '\n---\nImagine: `docker pull %s:%s` · instalare: `git clone https://github.com/%s.git && cd openvigil && sudo ./install.sh`\n' \
            "$IMAGINE" "${{ steps.v.outputs.versiune }}" "${{ github.repository }}" >> note.md
          cat note.md

      - name: Release pe GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "OpenVigil ${{ steps.v.outputs.versiune }}" --notes-file note.md
