# Release: la un tag `vX.Y.Z` construieste imaginea cu versiunea in ea, o testeaza, o publica
# in GitHub Container Registry (ghcr.io/sm26449/openvigil:X.Y.Z si :latest) si creeaza
# release-ul pe GitHub cu notele din CHANGELOG.md. Doar amd64 (CUDA).
# Un tag `vX.Y.Z-rcN` face un release CANDIDAT: imaginea doar ca :X.Y.Z-rcN (fara :latest),
# release-ul marcat pre-release, cu notele sectiunii [X.Y.Z] din CHANGELOG.md.
#
#   git tag -a v1.0.0 -m "1.0.0" && git push origin v1.0.0
#   git tag -a v1.1.0-rc1 -m "1.1.0-rc1" && git push origin v1.1.0-rc1
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"]

permissions:
  contents: write
  packages: write

env:
  IMAGINE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: imagine + release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Postgres de unica folosinta pentru testele cu DB (altfel release-ul rula doar subsetul
    # fara DB si putea publica o versiune cu teste backend nerulate — REL-01).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: openvigil
          POSTGRES_USER: openvigil
          POSTGRES_PASSWORD: openvigil
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openvigil"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7 (fixat pe SHA: un tag mutat nu schimba ce ruleaza)

      - name: Versiunea din tag
        id: v
        run: |
          versiune="${GITHUB_REF_NAME#v}"
          baza="${versiune%%-rc*}"                       # 2.2.0-rc7 -> 2.2.0 (sectiunea din CHANGELOG)
          rc=$([ "$baza" != "$versiune" ] && echo true || echo false)
          { echo "versiune=$versiune"; echo "baza=$baza"; echo "rc=$rc"; } >> "$GITHUB_OUTPUT"
          grep -q "^## \[$baza\]" CHANGELOG.md || { echo "CHANGELOG.md nu are sectiunea [$baza]"; exit 1; }

      - name: Loc pe disc (imaginea are ~11 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Build
        run: |
          docker build -t "$IMAGINE:${{ steps.v.outputs.versiune }}" \
            --build-arg PUID=1000 --build-arg PGID=1000 \
            --build-arg OPENVIGIL_VERSION=${{ steps.v.outputs.versiune }} .

      - name: Teste in imagine (cu DB)
        run: |
          docker run --rm "$IMAGINE:${{ steps.v.outputs.versiune }}" venv/bin/python -c "import config; assert config.VERSIUNE == '${{ steps.v.outputs.versiune }}', config.VERSIUNE"
          # Suita completa, inclusiv testele cu Postgres — altfel release-ul ar putea publica o
          # versiune cu testele de DB nerulate (REL-01). --network host ca sa ajunga la serviciul PG.
          docker run --rm --network host -e TZ=Europe/Bucharest \
            -e PG_HOST=127.0.0.1 -e PG_PORT=5433 -e PG_DB=openvigil -e PG_USER=openvigil -e PG_PASS=openvigil \
            -e OPENVIGIL_TEST_DB=1 \
            "$IMAGINE:${{ steps.v.outputs.versiune }}" test

      - name: Publicare in GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGINE:${{ steps.v.outputs.versiune }}"
          # un candidat NU muta :latest — cine instaleaza fara versiune ramane pe ultima stabila
          if [ "${{ steps.v.outputs.rc }}" != "true" ]; then
            docker tag "$IMAGINE:${{ steps.v.outputs.versiune }}" "$IMAGINE:latest"
            docker push "$IMAGINE:latest"
          fi

      - name: Notele din CHANGELOG
        run: |
          if [ "${{ steps.v.outputs.rc }}" = "true" ]; then
            printf '> **Release candidate** for %s — for testing; the stable `:latest` image is not changed.\n\n' "${{ steps.v.outputs.baza }}" > note.md
          else
            : > note.md
          fi
          awk -v v="${{ steps.v.outputs.baza }}" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}' CHANGELOG.md >> note.md
          printf '\n---\nImagine: `docker pull %s:%s` · instalare: `git clone https://github.com/%s.git && cd openvigil && sudo ./install.sh`\n' \
            "$IMAGINE" "${{ steps.v.outputs.versiune }}" "${{ github.repository }}" >> note.md
          cat note.md

      - name: Release pe GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=$([ "${{ steps.v.outputs.rc }}" = "true" ] && echo "--prerelease" || echo "")
          gh release create "$GITHUB_REF_NAME" --title "OpenVigil ${{ steps.v.outputs.versiune }}" --notes-file note.md $pre
