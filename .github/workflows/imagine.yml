# Construieste imaginea Docker si ruleaza testele IN imagine (pe CPU). Dureaza ~20 de minute
# si descarca ~6 GB, de aceea ruleaza doar cand se schimba ce intra in imagine, saptamanal
# si la cerere. Publica rezultatul ca ghcr.io/sm26449/openvigil:edge (ultimul main, pentru
# cine vrea sa incerce); versiunile stabile (:X.Y.Z, :latest) le publica release.yml.
name: Imagine Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.lock
      - docker/**
      - .github/workflows/imagine.yml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagine:
    name: build + teste in container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Loc pe disc (imaginea are ~11 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Build
        run: docker build -t openvigil:ci --build-arg PUID=1000 --build-arg PGID=1000 --build-arg OPENVIGIL_VERSION=edge-${GITHUB_SHA::7} .

      - name: Ce e inauntru
        run: |
          docker run --rm openvigil:ci ffmpeg -hide_banner -version | head -1
          docker run --rm --entrypoint /usr/local/bin/go2rtc openvigil:ci -version   # fara entrypoint: `go2rtc` ar porni serverul
          docker run --rm openvigil:ci venv/bin/python -c "import torch, ultralytics, insightface, transformers, onnxruntime; print('torch', torch.__version__, '| onnx', onnxruntime.get_available_providers())"

      - name: Teste in imagine
        run: docker run --rm -e TZ=Europe/Bucharest openvigil:ci test

      - name: Publicare :edge in GHCR (doar de pe main)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag openvigil:ci ghcr.io/${{ github.repository }}:edge
          docker push ghcr.io/${{ github.repository }}:edge
