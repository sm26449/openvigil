# Suprapunere pentru gazde cu placa NVIDIA (cere nvidia-container-toolkit; install.sh il pune).
# Foloseste runtime-ul `nvidia` (nu `--gpus`): merge si dupa un simplu `systemctl reload docker`.
# go2rtc si web transcodeaza cu NVENC/NVDEC, ai face inferenta pe CUDA. record nu are nevoie.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

x-gpu: &gpu
  environment:
    TZ: ${TZ:-UTC}
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
  runtime: nvidia

services:
  go2rtc:
    <<: *gpu
  web:
    <<: *gpu
  ai:
    <<: *gpu
